# ======================================================================
#  Récompenses (identiques pour le simulateur et le vrai jeu)
# ======================================================================
rewards:
  per_point: 0.001             # + par point de score (le score de City monte vite : ~100 pts/s avec x8,5)
  per_coin: 1.0                # + pour chaque pièce ramassée
  per_multiplier_star: 5.0     # + pour chaque étoile secrète ramassée (bandeau « ÉTOILE SECRÈTE »)
  death: -10.0                 # - quand il meurt
  stumble: -3.0                # - quand il se prend un mur / trébuche
  alive_bonus: 0.0             # + petit bonus par pas de temps vivant (optionnel)
  normalize_score_by_multiplier: false
  max_points_per_step: 50000   # protège contre les erreurs de lecture OCR

# ======================================================================
#  Agent (PPO + réseau convolutif sur les pixels)
# ======================================================================
agent:
  frame_stack: 4               # 4 images empilées -> l'agent perçoit la vitesse/le mouvement
  learning_rate: 0.00025
  n_steps: 256                 # pas par environnement avant chaque mise à jour (simulateur)
  n_steps_screen: 512          # idem pour le vrai jeu
  batch_size: 256
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.1
  ent_coef: 0.01               # encourage l'exploration
  save_every: 50000

# Curiosité (RND) : récompense intrinsèque pour découvrir des situations nouvelles
curiosity:
  enabled: true
  beta: 0.5
  lr: 0.0001
  update_every: 256

# Fenêtre temps réel avec un cadre autour de chaque élément (train.py/play.py --overlay)
overlay:
  display_height: 900          # hauteur de la fenêtre (pixels)
  show_attention: true         # carte de chaleur : où l'IA regarde pour décider
  every_n_steps: 1             # 2 ou 3 si le PC est lent
  player_detector: models/player_detector.pt   # détecteur du personnage (train_player.py) ;
                               # à défaut : pretrained/player_detector.pt, puis le suivi ci-dessous
  player_tracker:              # suivi du personnage si aucun détecteur (moins fiable)
    home: [0.39, 0.65, 0.59, 0.85]  # sa place habituelle (x0, y0, x1, y1 en fractions) ;
                                    # ou plus précis : python calibrate.py region player
    update_rate: 0.15          # vitesse d'adaptation à son apparence (éclairage, bulle...)
    min_score: 0.35            # en dessous : considéré perdu, puis recalé sur sa place habituelle
  discovery:
    n_types: 10                # nombre maximum de types d'éléments qu'il peut inventer
    diff_threshold: 30         # sensibilité (plus bas = plus de cadres)
    min_area: 0.0008           # taille minimale d'un élément (fraction de l'image)
    ignore_top: 0.12           # ne pas encadrer le HUD (haut de l'écran)
    roi: null                  # zone de recherche : null = tout l'écran
                               # (ex. rails seulement : [[0.25, 0.22], [0.75, 0.22], [1.0, 0.92], [0.0, 0.92]])
    obstacle_factor: 1.5       # OBSTACLE si suivi de chocs/morts 1,5x plus que la moyenne (cadre rouge)
    bonus_factor: 1.5          # BONUS si suivi de pièces/étoiles 1,5x plus que la moyenne (cadre vert)
    bonus_horizon: 12          # pas (~1 s) pendant lesquels les gains comptent après un contact
                               # (augmentez-le pour les bonus qui rapportent après coup, comme l'aimant)
    danger_horizon: 5
    min_touches: 10            # contacts nécessaires avant de juger un type

# ======================================================================
#  Subway Surfers City (téléphone affiché sur le PC par scrcpy, ou BlueStacks)
#  Toutes les valeurs ci-dessous sont des exemples : utilisez calibrate.py
# ======================================================================
game:
  controller: mouse_swipe      # swipes à la souris dans la fenêtre scrcpy/BlueStacks
                               # (autres choix : "keyboard" si les flèches sont associées à des swipes, "adb")
  capture: {left: 0, top: 31, width: 473, height: 1024}  # écran du téléphone dans la fenêtre scrcpy
  step_interval: 0.1           # secondes entre deux décisions (10 actions/s)
  obs_size: 84
  grayscale: false             # la couleur aide à distinguer pièces / étoiles / obstacles
  obs_crop_y: [0.0, 1.0]       # partie verticale de l'image donnée à l'agent
  use_hoverboard: false        # dans City le hoverboard demande de l'énergie : laissez désactivé au début
  max_episode_steps: 20000

  # Zones [x, y, largeur, hauteur] relatives à la zone capturée
  regions:
    # (exemples pour un téléphone 591x1280 affiché en 473x1024 par scrcpy)
    score: [196, 68, 134, 42]       # « 151 877 »
    coins: [404, 76, 52, 28]        # « 206 » à côté de la pièce
    multiplier: [72, 66, 118, 44]   # « x8,5 » / « x11,3 » (informatif ; mettre null si inutile)

  # Images de référence (capturées avec calibrate.py template <nom>) ; VOS images sont
  # enregistrées dans config.local.yaml, qui remplace ces listes vides.
  templates:
    ingame: []                 # le bouton pause jaune : visible seulement EN JEU (mort, relance, pause)
    death: []                  # (facultatif) un élément de l'écran « Continuer la course ? »
    stumble: []                # le garde (et son chien) qui apparaît en bas à gauche après un choc
    #  - {path: templates/stumble.png, region: [0, 300, 800, 300], threshold: 0.75}
    star: []                   # le bandeau « ÉTOILE SECRÈTE » (calibrate.py record + template star)
    # boutons cliqués automatiquement pour relancer une partie (voir restart_buttons)
    terminer: []               # le texte « APPUIE POUR TERMINER LA COURSE » (PAS le bouton à clés !)
    continuer: []              # le bouton orange CONTINUER de l'écran des scores
    course: []                 # le bouton COURSE du menu
    fermer: []                 # croix d'une fenêtre surprise (pub, récompense...)
    reprendre: []              # le bouton pour reprendre après une pause
  ingame_missing_for_death: 8  # bouton pause absent pendant N pas (~0,8 s) = partie finie
  frozen_frames_for_death: 15  # image figée pendant N pas = mort (secours)
  stumble_cooldown_steps: 10
  max_score_jump: 50000        # les bonus du jeu peuvent ajouter plusieurs milliers de points d un coup
  star_cooldown_steps: 3       # pas minimum entre deux étoiles comptées

  # Relance automatique : les boutons sont cherchés à l'écran et cliqués dans cet ordre
  # jusqu'à ce que le bouton pause (ingame) réapparaisse
  restart_buttons: [terminer, continuer, course, fermer]
  restart_timeout: 60          # secondes max pour revenir en jeu
  restart_click_wait: 1.5
  resume_wait: 3.0             # compte à rebours après « reprendre »

  # Clics de secours, si aucun bouton n'est reconnu (et ancienne méthode sans images de boutons)
  # Séquences d'actions : {click: [x, y]} dans la zone capturée, {key: ...}, {wait: secondes}
  # Relevez les positions des boutons avec : python calibrate.py point
  # (dans scrcpy, un clic droit = touche Retour d'Android)
  restart_sequence:
    - {wait: 2.0}
    - {click: [235, 900]}      # refuser "Continuer ?" / passer
    - {wait: 2.0}
    - {click: [235, 880]}      # écran des résultats -> bouton pour rejouer
    - {wait: 2.0}
    - {click: [235, 850]}      # "Toucher pour jouer" / bouton Jouer
    - {wait: 3.0}
  pause_sequence:
    - {click: [44, 92]}        # bouton pause jaune en haut à gauche
  resume_sequence:
    - {click: [235, 520]}      # bouton reprendre
    - {wait: 3.0}              # compte à rebours de reprise

  mouse_swipe:                 # pour controller: mouse_swipe
    distance: 0.25
    duration: 0.05
    start_y: 0.6

  adb:
    serial: null
    device_width: 1080
    device_height: 2400
    swipe_ms: 60
