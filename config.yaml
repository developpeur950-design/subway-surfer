# ======================================================================
#  Récompenses (identiques pour le simulateur et le vrai jeu)
# ======================================================================
rewards:
  per_point: 0.01              # + pour chaque point de score gagné
  per_coin: 1.0                # + pour chaque pièce ramassée
  per_multiplier_star: 5.0     # + pour chaque étoile ramassée (= +1 au multiplicateur de la partie)
  death: -10.0                 # - quand il meurt
  stumble: -3.0                # - quand il se prend un mur / trébuche
  alive_bonus: 0.0             # + petit bonus par pas de temps vivant (optionnel)
  normalize_score_by_multiplier: false
  max_points_per_step: 5000    # protège contre les erreurs de lecture OCR

# ======================================================================
#  Agent (PPO + réseau convolutif sur les pixels)
# ======================================================================
agent:
  frame_stack: 4               # 4 images empilées -> l'agent perçoit la vitesse/le mouvement
  learning_rate: 0.00025
  n_steps: 256                 # pas par environnement avant chaque mise à jour (simulateur)
  n_steps_screen: 512          # idem pour le vrai jeu
  batch_size: 256
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.1
  ent_coef: 0.01               # encourage l'exploration
  save_every: 50000

# Curiosité (RND) : récompense intrinsèque pour découvrir des situations nouvelles
curiosity:
  enabled: true
  beta: 0.5
  lr: 0.0001
  update_every: 256

# ======================================================================
#  Subway Surfers City (téléphone affiché sur le PC par scrcpy, ou BlueStacks)
#  Toutes les valeurs ci-dessous sont des exemples : utilisez calibrate.py
# ======================================================================
game:
  controller: mouse_swipe      # swipes à la souris dans la fenêtre scrcpy/BlueStacks
                               # (autres choix : "keyboard" si les flèches sont associées à des swipes, "adb")
  capture: {left: 0, top: 31, width: 470, height: 1024}  # écran du téléphone dans la fenêtre scrcpy
  step_interval: 0.1           # secondes entre deux décisions (10 actions/s)
  obs_size: 84
  grayscale: false             # la couleur aide à distinguer pièces / étoiles / obstacles
  obs_crop_y: [0.0, 1.0]       # partie verticale de l'image donnée à l'agent
  use_hoverboard: false        # dans City le hoverboard demande de l'énergie : laissez désactivé au début
  max_episode_steps: 20000

  # Zones [x, y, largeur, hauteur] relatives à la zone capturée
  regions:
    score: [300, 20, 160, 40]
    coins: [300, 65, 160, 35]
    multiplier: [230, 20, 65, 40]   # le "x12" : chaque +1 = une étoile ramassée

  # Images de référence (capturées avec calibrate.py)
  templates:
    death:                     # écran de fin de partie / "Continuer ?"
      - {path: templates/death.png, threshold: 0.8}
    stumble: []                # ex : flash/icône quand on se cogne, l'inspecteur qui apparaît...
    #  - {path: templates/stumble.png, region: [0, 300, 800, 300], threshold: 0.75}
    star: []                   # secours si la zone "multiplier" n'est pas utilisable
  frozen_frames_for_death: 15  # image figée pendant N pas = mort (secours)
  stumble_cooldown_steps: 10
  max_score_jump: 5000
  max_stars_per_step: 3        # garde-fou OCR sur le multiplicateur

  # Séquences d'actions : {click: [x, y]} dans la zone capturée, {key: ...}, {wait: secondes}
  # Relevez les positions des boutons avec : python calibrate.py point
  # (dans scrcpy, un clic droit = touche Retour d'Android)
  restart_sequence:
    - {wait: 2.0}
    - {click: [235, 900]}      # refuser "Continuer ?" / passer
    - {wait: 2.0}
    - {click: [235, 880]}      # écran des résultats -> bouton pour rejouer
    - {wait: 2.0}
    - {click: [235, 850]}      # "Toucher pour jouer" / bouton Jouer
    - {wait: 3.0}
  pause_sequence:
    - {click: [30, 30]}        # bouton pause du jeu
  resume_sequence:
    - {click: [235, 520]}      # bouton reprendre
    - {wait: 3.0}              # compte à rebours de reprise

  mouse_swipe:                 # pour controller: mouse_swipe
    distance: 0.25
    duration: 0.05
    start_y: 0.6

  adb:
    serial: null
    device_width: 1080
    device_height: 2400
    swipe_ms: 60
